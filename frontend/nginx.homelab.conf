# Homelab static SPA server behind Caddy (Dockerfile). Caddy terminates TLS
# and rewrites HTML (umami + shared footer snippets), so responses leave here
# uncompressed. nginx.conf is the separate Cloud Run config (Dockerfile.prod).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip off;

    # Server-level headers are inherited only by locations that set no
    # add_header of their own, so caching below uses `expires` instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-hashed bundles never change.
    location ~ ^/(js|css)/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must revalidate so new deploys are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
